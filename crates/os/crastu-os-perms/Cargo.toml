[package]
name = "crastu-os-perms"
description = "Permission status, requests and System Settings links per platform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.crastu]
kind = "os"

[lints]
workspace = true

[dependencies]
crastu-core = { path = "../../core/crastu-core" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-application-services = { version = "0.3", features = ["AXUIElement", "HIServices", "AXError"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFString", "CFNumber"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow", "CGEvent", "CGEventTypes"] }
