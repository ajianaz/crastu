[package]
name = "crastu-audio"
description = "Audio capture, playback, resampling and voice activity detection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.crastu]
kind = "engine"

[lints]
workspace = true

[features]
# Live microphone capture through cpal. Off by default: the desktop turns it on; mobile builds
# use platform adapters instead (see docs/ARCHITECTURE.md).
mic = ["dep:cpal"]

[dependencies]
crastu-core = { path = "../../core/crastu-core" }
cpal = { version = "0.18", optional = true }

[[example]]
name = "level"
required-features = ["mic"]
