[package]
name = "crastu-store"
description = "SQLite storage with FTS5 and per-module versioned migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.crastu]
kind = "core"

[lints]
workspace = true

[dependencies]
crastu-core = { path = "../crastu-core" }
rusqlite = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["bundled"]
# Compiles SQLite into the binary (with FTS5). Mobile builds may use the system SQLite instead.
bundled = ["rusqlite/bundled"]

[dev-dependencies]
tempfile = { workspace = true }
