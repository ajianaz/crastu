[package]
name = "crastu-host"
description = "Headless core process: runs modules, jobs, store and engines without a window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.crastu]
kind = "core"

[lints]
workspace = true

[dependencies]
crastu-core = { path = "../crastu-core" }
crastu-module = { path = "../crastu-module" }
crastu-jobs = { path = "../crastu-jobs" }
crastu-store = { path = "../crastu-store", default-features = false }
crastu-ipc = { path = "../crastu-ipc" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
crastu-store = { path = "../crastu-store" }
tempfile = { workspace = true }
