[package]
name = "crastu-mcp"
description = "MCP server: router, risk tiers, approval policy, stdio and local HTTP transports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.crastu]
kind = "integration"

[lints]
workspace = true

[dependencies]
crastu-core = { path = "../../core/crastu-core" }
crastu-ipc = { path = "../../core/crastu-ipc" }
rmcp = { workspace = true, features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std"] }
serde_json = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "server", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
