[package]
name = "crastu-agents-ui"
description = "The Settings, Agents (MCP) page: pairing, the one-time token box, overrides, the default policy and recent calls. Draws crastu-shell-model's agents state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.crastu]
kind = "ui"

[lints]
workspace = true

[dependencies]
crastu-controls = { path = "../crastu-controls" }
crastu-shell-model = { path = "../crastu-shell-model" }
crastu-ui = { path = "../crastu-ui" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
crastu-widgets = { path = "../crastu-widgets" }
gpui = { workspace = true }
