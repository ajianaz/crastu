[workspace]
resolver = "3"
members = [
    "apps/*",
    "crates/core/*",
    "crates/engines/*",
    "crates/integrations/*",
    "crates/os/*",
    "crates/features/*/*",
    "crates/app/*",
    "crates/ui/*",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
repository = "https://github.com/ajianaz/crastu"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v7", "serde"] }
rusqlite = "0.41.1"
sha2 = "0.11.1"
tempfile = "3.27.0"
rmcp = { version = "3.9.0", default-features = false }
tokio = "1.54.1"
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
# GPUI (decision 27, spike #3): exact pins, moved together on purpose. Only ui, feature-ui and
# bin crates may depend on them (`cargo xtask deps-check`), and only on macOS and Windows for now.
# gpui-component 0.9.1 pins gpui-pre 0.3.12. `runtime_shaders` compiles the Metal shaders at
# launch because Xcode 26 no longer ships the shader compiler (issue #41).
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["runtime_shaders", "font-kit"] }
gpui-component = "=0.9.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
