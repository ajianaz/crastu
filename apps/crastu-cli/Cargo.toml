[package]
name = "crastu-cli"
description = "Headless Crastu CLI: runs the host and the stdio MCP shim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.crastu]
kind = "bin"

[lints]
workspace = true

[lib]
name = "crastu_cli"
path = "src/lib.rs"

[[bin]]
name = "crastu-cli"
path = "src/main.rs"

[dependencies]
crastu-core = { path = "../../crates/core/crastu-core" }
crastu-host = { path = "../../crates/core/crastu-host" }
crastu-ipc = { path = "../../crates/core/crastu-ipc" }
crastu-jobs = { path = "../../crates/core/crastu-jobs" }
crastu-store = { path = "../../crates/core/crastu-store" }
crastu-mcp = { path = "../../crates/integrations/crastu-mcp" }
crastu-models = { path = "../../crates/core/crastu-models" }
crastu-models-http = { path = "../../crates/integrations/crastu-models-http" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde_json = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
tempfile = { workspace = true }
