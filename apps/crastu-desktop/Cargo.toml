[package]
name = "crastu-desktop"
description = "Crastu desktop app. Composition root: Cargo features choose which modules are built in."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.crastu]
kind = "bin"
# Each entry is built alone by `cargo xtask build-matrix`.
modules = ["dictation", "voice", "clipper", "editor"]

[lints]
workspace = true

[[bin]]
name = "crastu"
path = "src/main.rs"

[features]
default = ["dictation", "voice", "clipper", "editor"]
dictation = ["dep:crastu-dictation-ui", "crastu-app/dictation"]
voice = ["dep:crastu-voice-ui", "crastu-app/voice"]
clipper = ["dep:crastu-clipper-ui", "crastu-app/clipper"]
editor = ["dep:crastu-editor-ui", "crastu-app/editor"]

[dependencies]
crastu-app = { path = "../../crates/app/crastu-app" }
crastu-settings = { path = "../../crates/core/crastu-settings" }
crastu-ui = { path = "../../crates/ui/crastu-ui" }
crastu-shell = { path = "../../crates/ui/crastu-shell" }
crastu-os-perms = { path = "../../crates/os/crastu-os-perms" }
crastu-crash = { path = "../../crates/os/crastu-crash" }
crastu-diagnostics = { path = "../../crates/core/crastu-diagnostics" }
crastu-recorder = { path = "../../crates/core/crastu-recorder" }
crastu-host = { path = "../../crates/core/crastu-host" }
crastu-module = { path = "../../crates/core/crastu-module" }
crastu-store = { path = "../../crates/core/crastu-store" }
crastu-models = { path = "../../crates/core/crastu-models" }
crastu-models-http = { path = "../../crates/integrations/crastu-models-http" }
crastu-dictation-ui = { path = "../../crates/features/dictation/crastu-dictation-ui", optional = true }
crastu-voice-ui = { path = "../../crates/features/voice/crastu-voice-ui", optional = true }
crastu-clipper-ui = { path = "../../crates/features/clipper/crastu-clipper-ui", optional = true }
crastu-editor-ui = { path = "../../crates/features/editor/crastu-editor-ui", optional = true }

# The headless commands need the local IPC, which exists on Unix only for now.
[target.'cfg(unix)'.dependencies]
crastu-ipc = { path = "../../crates/core/crastu-ipc" }
crastu-cli = { path = "../crastu-cli" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
