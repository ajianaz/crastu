name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-ios, aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Dependency rules
        run: cargo xtask deps-check

      - name: One module at a time
        run: cargo xtask build-matrix

      - name: Portable crates build for iOS and Android
        run: cargo xtask mobile-check

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licences, advisories, sources
        run: cargo deny check
