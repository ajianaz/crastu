# Bundled files that are not Cargo crates. `cargo xtask licences` lists them in NOTICE and copies
# their licence text into LICENSES/. Paths are relative to the repository root. The command fails
# when a font file under crates/ui/crastu-ui/assets/fonts is not listed in `files` below, or a
# listed file does not exist.

[[asset]]
name = "Inter"
version = "4.1"
spdx = "OFL-1.1"
source = "https://github.com/rsms/inter/releases/tag/v4.1"
license-file = "crates/ui/crastu-ui/assets/fonts/inter/OFL.txt"
files = [
    "crates/ui/crastu-ui/assets/fonts/inter/Inter-Medium.ttf",
    "crates/ui/crastu-ui/assets/fonts/inter/Inter-Regular.ttf",
    "crates/ui/crastu-ui/assets/fonts/inter/Inter-SemiBold.ttf",
]

[[asset]]
name = "JetBrains Mono"
version = "2.304"
spdx = "OFL-1.1"
source = "https://github.com/JetBrains/JetBrainsMono/releases/tag/v2.304"
license-file = "crates/ui/crastu-ui/assets/fonts/jetbrains-mono/OFL.txt"
files = [
    "crates/ui/crastu-ui/assets/fonts/jetbrains-mono/JetBrainsMono-Medium.ttf",
    "crates/ui/crastu-ui/assets/fonts/jetbrains-mono/JetBrainsMono-Regular.ttf",
]

# Models: none are bundled today. A bundled model gets an entry like this one (kept as a comment
# until there is one), with the licence id of its weights and the licence text next to them:
#
# [[model]]
# name = "<model name>"
# version = "<version or revision>"
# spdx = "<SPDX id>"
# source = "<download URL>"
# license-file = "<path of the licence text in the repository>"
# files = []
