name: Feature request
description: Suggest a capability or an improvement.
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or tools you considered.
  - type: checkboxes
    id: licence
    attributes:
      label: Licence
      options:
        - label: Any model, library or asset this needs allows commercial use.
