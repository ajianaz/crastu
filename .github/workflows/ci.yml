name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Branch uses a CodeCora prefix
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD" =~ ^(feat|fix|docs|chore|refactor|perf|test|ci|build|release)/[a-z0-9._-]+$ || "$HEAD" == "develop" ]]; then
            echo "ok: $HEAD"
          else
            echo "::error::Branch '$HEAD' must start with feat/, fix/, docs/, chore/, refactor/, perf/, test/, ci/, build/ or release/"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-ios, aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Dependency rules
        run: cargo xtask deps-check

      - name: One module at a time
        run: cargo xtask build-matrix

      - name: Portable crates build for iOS and Android
        run: cargo xtask mobile-check

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licences, advisories, sources
        run: cargo deny check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests on macOS
        run: cargo test --workspace

      - name: Desktop app builds on macOS
        run: cargo build -p crastu-desktop
