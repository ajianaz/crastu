name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Branch uses a CodeCora prefix
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD" =~ ^(feat|fix|docs|chore|refactor|perf|test|ci|build|release)/[a-z0-9._-]+$ || "$HEAD" == "develop" ]]; then
            echo "ok: $HEAD"
          else
            echo "::error::Branch '$HEAD' must start with feat/, fix/, docs/, chore/, refactor/, perf/, test/, ci/, build/ or release/"
            exit 1
          fi

  message-standard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Title, body and commit messages follow the team message standard
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The patterns come from the base branch, so a pull request cannot loosen its own gate
          # (the first pull request that adds the script falls back to its own copy).
          patterns="$RUNNER_TEMP/message-patterns.sh"
          git show "$BASE:scripts/hooks/message-patterns.sh" > "$patterns" 2>/dev/null \
            || cp scripts/hooks/message-patterns.sh "$patterns"
          bad=0
          check() {
            found="$(printf '%s\n' "$2" | sh "$patterns")"
            if [ -n "$found" ]; then
              echo "::error::message-standard: $1 has a line that is not allowed (see team message standard)"
              bad=1
            fi
          }
          check "the pull request title" "$TITLE"
          check "the pull request description" "$BODY"
          for sha in $(git rev-list "$BASE..$HEAD"); do
            check "commit ${sha}" "$(git log -1 --format=%B "$sha")"
          done
          exit "$bad"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-ios, aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Dependency rules
        run: cargo xtask deps-check

      - name: File and crate sizes
        run: cargo xtask size-check

      - name: No colour or font literals in UI crates
        run: cargo xtask ui-literals

      - name: One module at a time
        run: cargo xtask build-matrix

      - name: Portable crates build for iOS and Android
        run: cargo xtask mobile-check

      - name: NOTICE and LICENSES are up to date
        run: cargo xtask licences --check

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licences, advisories, sources
        run: cargo deny check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests on macOS
        run: cargo test --workspace

      - name: Desktop app builds on macOS
        run: cargo build -p crastu-desktop
